name: Gateway demo
run-name: Gateway · ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Demo operation
        required: true
        type: choice
        options: [Deploy, Status, Verify samples, Remove]

permissions:
  contents: read
  deployments: write

concurrency:
  group: gateway-deployment
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-24.04
    environment: gateway
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install the pinned OCI client
        run: python -m pip install --disable-pip-version-check oci-cli==3.94.0
      - name: Run the selected operation
        env:
          GATEWAY_ACTION: ${{ inputs.action }}
          DEPLOYMENT_CONFIG: ${{ vars.DEPLOYMENT_CONFIG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: python -m deployment --action "$GATEWAY_ACTION"
